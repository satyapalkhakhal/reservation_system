# Local development / evaluation stack:  docker compose up --build
# Defaults below are LOCAL-ONLY placeholders; override them via .env
# (see .env.example). Never reuse them in a real deployment.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reservations}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-reservations}
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      # Host port 55432 (localhost only) to avoid clashing with a local PostgreSQL.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-reservations}:${POSTGRES_PASSWORD:-local-dev-password}@postgres:5432/${POSTGRES_DB:-reservations}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      PER_USER_LIMIT: ${PER_USER_LIMIT:-4}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret-change-me-0000}
      AUTH_DEV_TOKENS_ENABLED: ${AUTH_DEV_TOKENS_ENABLED:-true}
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    # Room for connection bursts (pairs with LISTEN_BACKLOG, default 4096).
    sysctls:
      - net.core.somaxconn=4096
    restart: unless-stopped

volumes:
  pgdata:
