# Local development / evaluation stack:  docker compose up --build
# Defaults below are LOCAL-ONLY placeholders; override them via .env
# (see .env.example). Never reuse them in a real deployment.
x-logging: &default-logging
  # Docker keeps container logs forever by default; at ~30 MB of logs per
  # on-sale burst that filled a 10 GB disk. Rotate: at most 3 x 50 MB each.
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reservations}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-reservations}
    # Budget: request pools (at most 160) + 2 per worker for readiness +
    # metrics + migrations, with headroom.
    command:
      - postgres
      - -c
      - max_connections=300
      # Modest memory settings for a dedicated VM (defaults assume 128 MB).
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_completion_target=0.9
    # Parallel queries use /dev/shm; Docker's 64 MB default can be too small.
    shm_size: 256mb
    ports:
      # Host port 55432 (localhost only) to avoid clashing with a local PostgreSQL.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    logging: *default-logging
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-reservations}:${POSTGRES_PASSWORD:-local-dev-password}@postgres:5432/${POSTGRES_DB:-reservations}
      # Empty = automatic: 20 for one process, or DB_POOL_TOTAL split across workers.
      DB_POOL_MAX: ${DB_POOL_MAX:-}
      # Empty = automatic: 5 per worker, between 20 and 160.
      DB_POOL_TOTAL: ${DB_POOL_TOTAL:-}
      # One Node worker per CPU core (node:cluster). Set 1 to disable.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-auto}
      # How cluster workers get connections: empty/none = each worker accepts
      # directly; rr = the primary accepts and hands them out.
      NODE_CLUSTER_SCHED_POLICY: ${NODE_CLUSTER_SCHED_POLICY:-}
      PER_USER_LIMIT: ${PER_USER_LIMIT:-4}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret-change-me-0000}
      AUTH_DEV_TOKENS_ENABLED: ${AUTH_DEV_TOKENS_ENABLED:-true}
      # User ids allowed to create shows (POST /shows), comma-separated.
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-admin}
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    # Room for connection bursts (pairs with LISTEN_BACKLOG, default 4096).
    sysctls:
      - net.core.somaxconn=4096
    restart: unless-stopped

volumes:
  pgdata:
