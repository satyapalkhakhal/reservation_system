# Production overlay: HTTPS via Caddy in front of the API.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Requires in .env: DOMAIN (e.g. reservation.example.com), POSTGRES_PASSWORD,
# JWT_SECRET. The API is no longer published directly; only Caddy listens on
# 80/443 and forwards to app:3000 over the internal network.
x-logging: &default-logging
  # Docker keeps container logs forever by default; at ~30 MB of logs per
  # on-sale burst that filled a 10 GB disk. Rotate: at most 3 x 50 MB each.
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  app:
    ports: !reset []

  caddy:
    logging: *default-logging
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    # On-sale bursts open thousands of TLS connections at once. The default
    # accept queue (4096) overflows and dropped SYNs are retried by clients
    # only after 1s/3s/7s, surfacing as connect timeouts. Go sizes its listen
    # backlog from net.core.somaxconn.
    sysctls:
      - net.core.somaxconn=65535
      - net.ipv4.tcp_max_syn_backlog=65535
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates; keep across restarts (Let's Encrypt rate limits)
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
